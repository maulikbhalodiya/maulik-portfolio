<!--
	CONDITION: a page using the "projects" custom template. Registered in
	theme.json customTemplates under the name "projects". Served at /projects/.

	The archive listing for case studies. It queries the post type rather than
	reading a client-side filter state, because server-side filtering is what
	works without JavaScript and costs nothing in layout shift.

	THE FILTER IS A LATER PHASE. When it arrives it must be server-side filter
	links with query parameters, not client state. The reconciliation problems in
	the prototype filter, where the button vocabulary and the tag vocabulary are
	different word sets, have to be resolved at that point rather than carried
	over.

	A template is block markup. It is parsed, not executed, so it cannot call
	esc_html__(). The query is non-inheriting and unfiltered here because the
	custom post type does not exist yet; tighten it when the CPT lands.
-->
