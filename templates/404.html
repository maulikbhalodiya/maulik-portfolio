<!--
	CONDITION: no route matched. A block theme must ship a real 404.html as a
	file, because the design's 404 is an inline prototype fallback with no URL of
	its own.

	The eyebrow "404 / ROUTE NOT RESOLVED" is taken verbatim from that design and
	is correct as written. Do not rewrite it into something softer or friendlier.
	The square bullet motif opens the eyebrow here exactly as it opens every
	homepage section eyebrow: an 8x8px amber span, aria-hidden, because a
	decorative shape must never reach a screen reader.

	A template is block markup. It is parsed, not executed, so it cannot call
	esc_html__() and literal text here is NOT translatable. That is the reason
	every other template in this theme leaves its headings empty rather than
	filling them with placeholder English. This file is the deliberate exception:
	a 404 view with no message is useless, so the design's own short strings are
	kept here and the translatable versions live in patterns/404.php.
-->
<!-- wp:group {"tagName":"div","className":"wp-site-blocks","layout":{"type":"constrained"}} -->
<div class="wp-site-blocks">
	<!-- wp:template-part {"slug":"header","tagName":"header"} /-->

	<!-- wp:group {"tagName":"main","className":"site-main","layout":{"type":"constrained"}} -->
	<main class="wp-block-group site-main">
		<!-- wp:group {"tagName":"section","className":"error-404 dark-grid","layout":{"type":"constrained"}} -->
		<section class="wp-block-group error-404 dark-grid">
			<!-- wp:paragraph {"className":"eyebrow","typography":{"fontFamily":"var:preset|font-family|mono"}} -->
			<p class="eyebrow"><span class="w-2 h-2 bg-accent" aria-hidden="true"></span> <span class="eyebrow-text">404 / ROUTE NOT RESOLVED</span></p>
			<!-- /wp:paragraph -->

			<!-- wp:heading {"level":1} -->
			<h1 class="wp-block-heading">Page not found.</h1>
			<!-- /wp:heading -->

			<!-- wp:paragraph -->
			<p>That URL does not exist on this site. It may have moved, or the address may be mistyped.</p>
			<!-- /wp:paragraph -->

			<!-- wp:buttons {"layout":{"type":"flex","flexWrap":"wrap"}} -->
			<div class="wp-block-buttons">
				<!-- wp:button -->
				<div class="wp-block-button"><a class="wp-block-button__link wp-element-button" href="/">Back to home</a></div>
				<!-- /wp:button -->

				<!-- wp:button {"className":"is-style-outline"} -->
				<div class="wp-block-button is-style-outline"><a class="wp-block-button__link wp-element-button" href="/projects/">Browse projects</a></div>
				<!-- /wp:button -->
			</div>
			<!-- /wp:buttons -->
		</section>
		<!-- /wp:group -->
	</main>
	<!-- /wp:group -->

	<!-- wp:template-part {"slug":"footer","tagName":"footer"} /-->
</div>
<!-- /wp:group -->
