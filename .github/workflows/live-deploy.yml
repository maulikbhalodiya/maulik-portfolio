name: Live Deploy

# Deploys the block theme to the live server. Manual dispatch only.
#
# This runs AFTER CI has already passed on the pull request, so the full CI
# suite (phpcs, phpstan, stylelint, eslint, composer validate) is deliberately
# not repeated here. tools/deploy-theme.sh is the local equivalent of this
# workflow and is the reference for the gate order.
# AUTO-DEPLOY IS DISABLED. This workflow used to trigger on every push to main,
# which meant that merging any pull request silently replaced the live site with
# whatever main happened to contain. At the time this was changed, main did not
# carry the theme at all, so a merge could have deployed an incomplete tree over a
# working site. It also made concurrent work unsafe, because a second merge could
# land while a deploy from the first was still running.
#
# Deploys are now manual only. tools/deploy-theme.sh is the local equivalent and
# is the reference for the gate order. Nothing reaches the live host without a
# deliberate dispatch of this workflow, or a local run of that script.
on:
  # push:  removed. Do not restore it without reading the reason above.
  # Manual trigger. Three consecutive deploys failed on runner side problems
  # that could only be observed inside the Actions runtime, and every fix cost a
  # full open, review and merge cycle before it could be tested. This turns that
  # loop from minutes into about thirty seconds, which is the difference between
  # diagnosing and guessing.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Do not cancel in progress. Cancelling mid rsync leaves a half copied theme
  # on the server, which is worse than a slower queue. Merges are serialised
  # instead: one deploy finishes before the next starts.
  group: live-deploy
  cancel-in-progress: false

jobs:
  # Every quality gate that CI runs, repeated here as a hard barrier to deploying.
  #
  # WHY THIS DUPLICATES ci.yml. CI already gated the pull request, so running
  # this again on main is redundant in the happy path. It is here because CI can
  # be bypassed: a maintainer can push straight to main, a required check can be
  # skipped, and a merge can land while a workflow is failing for an unrelated
  # reason. This job makes the deploy itself refuse to run on bad code, rather
  # than trusting that something upstream did the checking.
  #
  # The commands are copied from ci.yml rather than invented, so the two cannot
  # drift into checking different things.
  gates:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install PHP dependencies
        run: composer install --no-progress --no-interaction

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Assert WPCS is at least 3.4.1
        run: |
          set -euo pipefail
          installed="$(composer show wp-coding-standards/wpcs --format=json | php -r '$d=json_decode(stream_get_contents(STDIN), true); echo $d["versions"][0];')"
          echo "Installed wp-coding-standards/wpcs version: ${installed}"
          php -r '
            $v = $argv[1];
            if ( version_compare( ltrim( $v, "v" ), "3.4.1", "<" ) ) {
              fwrite( STDERR, "FATAL: WPCS ${v} is below 3.4.1 and is vulnerable to RCE when linting untrusted code.\n" );
              exit( 1 );
            }
            echo "WPCS version is acceptable\n";
          ' "${installed}"

      - name: PHP lint
        run: |
          set -euo pipefail
          find . -name '*.php' -not -path './vendor/*' -not -path './node_modules/*' -print0 \
            | xargs -0 -n1 -P4 php -l > /dev/null
          echo "every PHP file parses"

      - name: PHP_CodeSniffer
        run: vendor/bin/phpcs --standard=phpcs.xml.dist

      - name: PHPStan
        run: composer stan

      - name: Stylelint
        run: npm run lint:css

      - name: ESLint
        run: npm run lint:js

      - name: Build CSS
        run: npm run build:css

      - name: Assert style.css still carries the WordPress theme header
        run: |
          set -euo pipefail
          grep -q '^Theme Name:' style.css || { echo "style.css lost its theme header" >&2; exit 1; }

      - name: Assert no em dashes or en dashes
        run: |
          set -euo pipefail
          if git grep -nP '[\x{2014}\x{2013}]' -- . \
            ':(exclude)node_modules' ':(exclude)vendor' \
            ':(exclude)package-lock.json' ':(exclude)composer.lock'; then
            echo "em or en dash found, which breaks the project rule" >&2
            exit 1
          fi
          echo "no em or en dashes"

      # NARROWED BY OWNER DECISION, NOT DELETED. The owner ruled that the demo
      # design's own address ships in the footer Connect column and in the
      # section 08 Email Me button, so a blanket ban on every mailto and every
      # raw address is now wrong here and would fail every deploy. These two
      # gates still reject any OTHER address, which is the whole point of
      # keeping them on the deploy path rather than only on CI.
      #
      # Built from parts so this gate does not match its own source, which is
      # the same trap ci.yml avoids. A literal here would make the gate fail
      # forever on the workflow file that contains it. The permitted address is
      # assembled the same way for the same reason.
      - name: Assert no mailto links other than the design's own
        run: |
          set -euo pipefail
          allowed="mail$(printf 'to')"':maulikbhalodiya9999@'"gmail.com"
          tok="mail$(printf 'to')"':[A-Za-z0-9._%%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}'
          found="$(git grep -oI -P "${tok}" -- . \
            ':(exclude)node_modules' \
            ':(exclude)vendor' \
            ':(exclude)package-lock.json' \
            ':(exclude)docs' \
            | sed 's|^[^:]*:||' \
            | sort -u || true)"
          unexpected="$(printf '%s\n' "${found}" | grep -v -F -x "${allowed}" || true)"
          if [ -n "${unexpected}" ]; then
            echo "mailto link other than the design's own found" >&2
            printf '%s\n' "${unexpected}" >&2
            exit 1
          fi
          echo "no unexpected mailto links"

      - name: Assert no raw email addresses other than the design's own
        run: |
          set -euo pipefail
          permitted="maulikbhalodiya9999@""gmail.com"
          found="$(git grep -oI -P '[A-Za-z0-9._%%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}' -- . \
            ':(exclude)node_modules' ':(exclude)vendor' \
            ':(exclude)package-lock.json' ':(exclude)composer.lock' \
            ':(exclude)languages/*.pot' ':(exclude)docs' \
            | sed 's|^[^:]*:||' \
            | sort -u || true)"
          unexpected="$(printf '%s\n' "${found}" | grep -v -F -x "${permitted}" || true)"
          if [ -n "${unexpected}" ]; then
            echo "raw email address other than the design's own found" >&2
            printf '%s\n' "${unexpected}" >&2
            exit 1
          fi
          echo "no unexpected raw email addresses"

      - name: Assert theme .htaccess is present in the repository
        run: |
          set -euo pipefail
          # The deploy rsyncs with --delete scoped to the theme directory, so a
          # file that exists only on the server gets deleted on the first real
          # deploy. These deny rules are what stop docs/ and tools/ being
          # readable over HTTP, so losing them reopens that exposure silently.
          test -f .htaccess || { echo ".htaccess is missing from the repo and would be deleted by rsync --delete" >&2; exit 1; }
          grep -q 'FilesMatch' .htaccess || { echo ".htaccess has no deny rules" >&2; exit 1; }
          echo "theme .htaccess will survive the deploy"

  deploy:
    needs: gates
    name: Deploy theme to live server
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Hardcoded on purpose. This is the only destination this workflow is
      # ever allowed to touch, and the guard step below refuses to run if it is
      # changed to anything else. The variable is not a secret and must not be
      # moved into one, because a secret here could be edited by anyone with
      # repo settings access to point at /var/www/maulik-dev itself.
      THEME_SLUG: maulik-portfolio
      WP_PATH: /var/www/maulik-dev
      SITE_URL: https://maulik-dev.duckdns.org
      THEME_DEST: /var/www/maulik-dev/wp-content/themes/maulik-portfolio
      ROUTES: '/ /about/ /resume/ /projects/ /rankkernel/ /contact/'

      # Secrets are mapped explicitly here because referencing them directly
      # in a run block is what makes them available. An earlier version of this
      # file read ${LIVE_DEPLOY_KEY} in a step but never declared it in env, so
      # every secret resolved to an empty string and the job refused to deploy.
      # The check that caught it is below and it did its job: it failed before
      # a single file was written to the server.
      LIVE_DEPLOY_KEY: ${{ secrets.LIVE_DEPLOY_KEY }}
      LIVE_SERVER_USER: ${{ secrets.LIVE_SERVER_USER }}
      LIVE_SERVER_IP: ${{ secrets.LIVE_SERVER_IP }}
      DEPLOY_KEY_FINGERPRINT: ${{ vars.DEPLOY_KEY_FINGERPRINT }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 'start' is the project's own script and runs 'tokens' then 'build:css'.
      # tokens regenerates the scss token partial from theme.json, so a colour
      # change in theme.json reaches the stylesheet. The build fails the job on
      # a scss error, which is the point: a broken stylesheet must not deploy.
      - name: Build CSS
        run: npm run start

      # style.css is the WordPress theme header and is NOT a build target. It is
      # committed as is and rsynced straight through, so the header is never
      # clobbered by the sass output.
      - name: Confirm the build produced the stylesheet
        run: |
          set -euo pipefail
          test -s assets/css/theme.css || {
            echo "FAIL: assets/css/theme.css was not produced by the build." >&2
            exit 1
          }
          echo "assets/css/theme.css: $(wc -c < assets/css/theme.css) bytes"

      - name: Check required secrets are present
        run: |
          set -euo pipefail
          missing=()
          [ -n "${LIVE_DEPLOY_KEY:-}" ] || missing+=("LIVE_DEPLOY_KEY")
          [ -n "${LIVE_SERVER_USER:-}" ] || missing+=("LIVE_SERVER_USER")
          [ -n "${LIVE_SERVER_IP:-}" ] || missing+=("LIVE_SERVER_IP")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "FAIL: missing required repository secret(s): ${missing[*]}" >&2
            echo "Create them with:" >&2
            echo "  gh secret set LIVE_DEPLOY_KEY --repo <owner>/<repo>   # the ssh PRIVATE key, PEM or openssh format" >&2
            echo "  gh secret set LIVE_SERVER_USER --repo <owner>/<repo>  # ssh user on the server" >&2
            echo "  gh secret set LIVE_SERVER_IP --repo <owner>/<repo>    # public IP of the server" >&2
            echo "The matching PUBLIC key must be in the deploy user's ~/.ssh/authorized_keys," >&2
            echo "and that user needs passwordless sudo limited to the rsync, chown and wp commands." >&2
            exit 1
          fi
          echo "all required secrets are present"

      # The key is written with 600 because ssh refuses a group or world readable
      # private key. It is added to known_hosts with accept-new rather than
      # StrictHostKeyChecking=no, so a changed host key fails the deploy instead
      # of silently trusting a new machine.
      - name: Write the ssh key
        run: |
          set -euo pipefail
          # The secret is base64 of the private key, not the key itself.
          #
          # An ssh private key is a multi-line PEM block. Stored raw, it reaches
          # the runner as a multi-line env var, and the run log showed that env
          # block coming out mangled, which produced a deploy_key file ssh would
          # not accept and a bare "Permission denied (publickey)" with nothing
          # useful in the log. base64 collapses it to one line, so there is no
          # newline or quoting ambiguity anywhere in the path.
          #
          # To rotate this secret:
          #   base64 -w0 ~/.ssh/gh_actions_deploy | gh secret set LIVE_DEPLOY_KEY
          printf '%s' "$LIVE_DEPLOY_KEY" | base64 -d > deploy_key
          chmod 600 deploy_key

      - name: Verify the deploy key fingerprint matches the server
        run: |
          set -euo pipefail
          # A fingerprint is derived from the public half and is public
          # information, so logging it reveals nothing about the private key.
          # Logging it is what turns the next failure from a guess into one line
          # of evidence: if this prints a fingerprint, the key arrived intact and
          # any later publickey error is a server side problem instead.
          got="$(ssh-keygen -y -f deploy_key | ssh-keygen -lf - | awk '{print $2}')"
          echo "deploy key fingerprint on this runner: ${got}"

          # Expected fingerprint of the public key in the deploy user's
          # authorized_keys. If these differ the runner holds a different key
          # from the one the server trusts, which is a deployment configuration
          # error rather than a code error.
          expected="${DEPLOY_KEY_FINGERPRINT}"
          if [ -n "${expected}" ]; then
            echo "fingerprint expected by the server   : ${expected}"
            if [ "${got}" != "${expected}" ]; then
              echo "FAIL: the key on this runner is not the key the server trusts." >&2
              echo "      Re-set the secret with:" >&2
              echo "        base64 -w0 ~/.ssh/gh_actions_deploy | gh secret set LIVE_DEPLOY_KEY" >&2
              exit 1
            fi
            echo "fingerprints match"
          else
            echo "no expected fingerprint configured, skipping comparison"
          fi

      - name: Confirm ssh connectivity
        run: |
          set -euo pipefail

          # Print the target before using it. The server IP and the deploy user are
          # not credentials: the IP is public and the username is the sole purpose of
          # the account. Three deploys failed on this step and the one fact that would
          # have identified the cause was not in the log, because the username and IP
          # were both masked as secrets.
          #
          # A trailing newline in a secret is invisible in a masked log and fatal here.
          # `ssh ghdeploy\n@host` fails with "remote username contains invalid
          # characters", which reads nothing like a newline problem. Both short secrets
          # are now set with `gh secret set NAME --body value` rather than piped through
          # echo, which appends one.
          echo "deploy target: ${LIVE_SERVER_USER}@${LIVE_SERVER_IP}"

          if ssh -i deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            "${LIVE_SERVER_USER}@${LIVE_SERVER_IP}" \
            'printf "connected: %s\n" "$(whoami)"; sudo -n true && echo "passwordless sudo: ok"'; then
            echo "ssh and sudo both work"
          else
            rc=$?
            echo ""
            echo "ssh failed with exit ${rc}. Full verbose trace follows." >&2
            echo "This is here because a bare 'Permission denied (publickey)' says" >&2
            echo "nothing about which side rejected the key." >&2
            ssh -vvv -i deploy_key \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=accept-new \
              -o BatchMode=yes \
              -o ConnectTimeout=15 \
              "${LIVE_SERVER_USER}@${LIVE_SERVER_IP}" true 2>&1 | tail -40 >&2
            exit "${rc}"
          fi

      - name: Guard the destination path
        run: |
          set -euo pipefail
          expected="/wp-content/themes/${THEME_SLUG}"
          case "${THEME_DEST}" in
            *"${expected}") : ;;
            *)
              echo "FAIL: refusing to deploy. THEME_DEST must end in ${expected}" >&2
              echo "       got: ${THEME_DEST}" >&2
              echo "Deploying to the install root would delete WordPress core." >&2
              exit 1
              ;;
          esac
          # A trailing slash or a parent reference would change what --delete
          # considers the root of the sync.
          case "${THEME_DEST}" in
            */|*..*) echo "FAIL: THEME_DEST must not end in a slash and must not contain '..'" >&2; exit 1 ;;
          esac
          echo "destination guard passed: ${THEME_DEST}"

      # Dry run first, so the file list and every deletion rsync would perform
      # is visible in the log before it happens. Deletions are listed too: an
      # unexpected delete is the visible symptom of a wrong destination.
      - name: rsync dry run to the live theme directory
        run: |
          set -euo pipefail
          rsync -azn --delete \
            --itemize-changes \
            --rsync-path="sudo -n /usr/bin/rsync" \
            -e "ssh -i deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='vendor/' \
            --exclude='deploy_key' \
            --exclude='docs/' \
            --exclude='tools/' \
            --exclude='.agents/' \
            --exclude='.audit-prompts/' \
            --exclude='*.md' \
            --exclude='.nvmrc' \
            --exclude='.editorconfig' \
            --exclude='.gitattributes' \
            --exclude='.gitignore' \
            --exclude='.coderabbit.yaml' \
            --exclude='.stylelintrc.json' \
            --exclude='eslint.config.mjs' \
            --exclude='phpcs.xml.dist' \
            --exclude='phpstan.neon' \
            --exclude='composer.json' \
            --exclude='composer.lock' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='scripts/' \
            ./ "${LIVE_SERVER_USER}@${LIVE_SERVER_IP}:${THEME_DEST}/"

      - name: rsync the theme to the live theme directory
        run: |
          set -euo pipefail
          # --delete is scoped to the theme directory above and nowhere else.
          # Nothing in this repository syncs to /var/www/maulik-dev, so
          # wp-includes, wp-admin and other themes are never in the blast radius.
          #
          # The exclude list keeps dev only trees out of the web root. None of
          # it is needed at runtime, and shipping it would publish internal
          # documentation and the deploy mechanics over HTTP. The live install
          # also carries a deny .htaccess inside the theme dir protecting the
          # same paths. The .htaccess is the first layer and this exclude list
          # is the second: if the .htaccess is ever lost the files are not on
          # disk to be served. Keep both.
          rsync -az --delete \
            --rsync-path="sudo -n /usr/bin/rsync" \
            -e "ssh -i deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='vendor/' \
            --exclude='deploy_key' \
            --exclude='docs/' \
            --exclude='tools/' \
            --exclude='.agents/' \
            --exclude='.audit-prompts/' \
            --exclude='*.md' \
            --exclude='.nvmrc' \
            --exclude='.editorconfig' \
            --exclude='.gitattributes' \
            --exclude='.gitignore' \
            --exclude='.coderabbit.yaml' \
            --exclude='.stylelintrc.json' \
            --exclude='eslint.config.mjs' \
            --exclude='phpcs.xml.dist' \
            --exclude='phpstan.neon' \
            --exclude='composer.json' \
            --exclude='composer.lock' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='scripts/' \
            ./ "${LIVE_SERVER_USER}@${LIVE_SERVER_IP}:${THEME_DEST}/"

      - name: Set ownership on the deployed theme
        run: |
          set -euo pipefail
          ssh -i deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new \
            "${LIVE_SERVER_USER}@${LIVE_SERVER_IP}" \
            "sudo -n /usr/local/sbin/ghdeploy-theme-chown '${THEME_DEST}' && echo 'ownership set to www-data:www-data'"

      # Activation runs as www-data rather than with --allow-root, so the theme
      # is activated in the same user context WordPress runs in. A theme that is
      # already active is a no-op and must not fail the job.
      - name: Activate the theme
        run: |
          set -euo pipefail
          ssh -i deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new \
            "${LIVE_SERVER_USER}@${LIVE_SERVER_IP}" \
            "sudo -n -u www-data wp theme activate '${THEME_SLUG}' --path='${WP_PATH}' || {
               echo 'activation returned non zero, checking whether the theme is already active';
               sudo -n -u www-data wp theme is-active '${THEME_SLUG}' --path='${WP_PATH}';
             }"

      # Core caches a theme's block patterns in a transient keyed by the theme
      # Version and only invalidates it when the Version changes. Copying new
      # files into patterns/ therefore does not register them, and the front end
      # renders fine while the new patterns stay invisible. Flushing both caches
      # is what makes the deployed files the ones actually served.
      - name: Clear transients and object cache
        run: |
          set -euo pipefail
          ssh -i deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new \
            "${LIVE_SERVER_USER}@${LIVE_SERVER_IP}" \
            "sudo -n -u www-data wp cache flush --path='${WP_PATH}'; sudo -n -u www-data wp transient delete --all --path='${WP_PATH}'"

      # The verification that matters most. A PHP fatal partway through render
      # still returns HTTP 200 with a complete <head> and no <body> at all: the
      # recorded failure was 200 with about 65KB of content and zero body. A
      # status code check alone passes that. So each route is asserted on the
      # body itself, and each route must have exactly one <h1> so a template
      # that fell through to index does not pass as a real page.
      #
      # assets/css/theme.css is asserted too, and separately, because a broken
      # docroot .htaccess 404s every static asset while the HTML renders
      # perfectly and nothing about the page load looks wrong.
      - name: Verify the live site
        run: |
          set -euo pipefail
          fail=0
          for route in ${ROUTES}; do
            body=$(mktemp)
            code=$(curl -sS --max-time 30 -o "${body}" -w '%{http_code}' "${SITE_URL}${route}" 2>/dev/null || echo 000)
            route_fail=0
            if [ "${code}" != "200" ]; then
              echo "FAIL ${route} returned HTTP ${code}, expected 200"
              route_fail=1
            else
              if ! grep -q '<body' "${body}"; then
                echo "FAIL ${route} returned 200 with $(wc -c < "${body}") bytes but no <body>. A PHP fatal during render produces a complete head and no body."
                route_fail=1
              fi
              if ! grep -q '<main' "${body}"; then
                echo "FAIL ${route} has no <main landmark, so the template did not render"
                route_fail=1
              fi
              h1=$(grep -o '<h1' "${body}" | wc -l | tr -d ' ')
              if [ "${h1}" != "1" ]; then
                echo "FAIL ${route} has ${h1} <h1 elements, expected exactly 1"
                route_fail=1
              fi
            fi
            if [ "${route_fail}" = "0" ]; then
              echo "ok   ${route} 200  $(wc -c < "${body}") bytes  ${h1:-?} h1"
            else
              fail=1
            fi
            rm -f "${body}"
          done

          asset="${SITE_URL}/wp-content/themes/${THEME_SLUG}/assets/css/theme.css"
          result=$(curl -sS --max-time 30 -o /dev/null -w '%{http_code} %{size_download}' "${asset}" 2>/dev/null || echo "000 0")
          code=${result%% *}
          size=${result##* }
          if [ "${code}" != "200" ] || [ "${size}" -le 1000 ]; then
            echo "FAIL ${asset} returned HTTP ${code} at ${size} bytes. A broken .htaccess 404s every static asset while the HTML still renders."
            fail=1
          else
            echo "ok   assets/css/theme.css 200 ${size} bytes"
          fi

          if [ "${fail}" != "0" ]; then
            echo ""
            echo "DEPLOY FAILED: the live site did not pass verification. The previous commit on main is still the last known good deploy; roll back with a revert merge."
            exit 1
          fi
          echo ""
          echo "DEPLOY SUCCEEDED: ${SITE_URL} is serving ${THEME_SLUG} at commit ${GITHUB_SHA}"

      - name: Summary
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "### Live deploy succeeded" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "- Commit: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- Destination: \`${THEME_DEST}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- Site: <${SITE_URL}>" >> "$GITHUB_STEP_SUMMARY"
            echo "- All routes returned 200 with a body, a main landmark and exactly one h1." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Live deploy failed" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "- Commit: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- Destination: \`${THEME_DEST}\` (theme directory only, never the install root)" >> "$GITHUB_STEP_SUMMARY"
            echo "- Check the failing step above. The site may be serving the previous deploy." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Remove the ssh key
        if: always()
        run: rm -f deploy_key
