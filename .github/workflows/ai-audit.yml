name: AI Audit

# Nightly audit of the whole theme rather than of a diff. Catches the class of
# problem that a pull request review structurally cannot: rot, drift, dead code,
# inconsistencies that only become visible over time.

on:
  schedule:
    # 02:00 UTC daily.
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      audit_category:
        description: 'Optional narrow the audit to a single standards document'
        required: false
        type: string
        default: ''

permissions:
  contents: read
  issues: write

concurrency:
  group: ai-audit
  # Deliberately NOT cancelling in progress. Unlike a CI run, a long audit that
  # finishes is worth more than a fast restart. If a manual run is queued behind
  # the nightly one, let both complete.
  cancel-in-progress: false

jobs:
  audit:
    name: Audit
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: AI audit
        uses: nilesh32236/opencode-ai-reviewer@103082c963f64cb2cf979ae14b729ec41d40866e # v1.22.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          model: anthropic/claude-sonnet-4-5
          opencode_version: 'v1.18.31'
          require_opencode_checksum: 'false'
          base_url: ${{ github.server_url }}
          audit_enabled: true
          audit_create_issues: true
          audit_auto_fix: false
          audit_labels: 'audit'
          audit_target_dirs: |
            inc
            patterns
            assets
            blocks
          max_files_per_batch: 3
          enable_mcp: false
          audit_category: ${{ inputs.audit_category }}
          project_context: |
            You are auditing a WordPress BLOCK THEME repository named maulik-dev.
            It is the personal developer portfolio theme of Maulik Bhalodiya, a
            WordPress and PHP developer. The theme slug, text domain, asset handle
            prefix and function prefix all use maulik-dev (functions maulik_dev,
            constants MAULIK_DEV). WordPress 6.7 minimum, tested to 6.9, PHP 7.4
            minimum.

            The repository's own documentation is INTERNAL and OUT OF SCOPE. Do not
            audit README.md, CONTRIBUTING.md, the files under .audit-prompts/,
            .github/workflows/, or the comments in this workflow. They are process
            documentation, not shipped code, and reporting findings there produces
            noise that trains people to ignore the audit. Audit the shipped theme:
            functions.php, inc/, patterns/, assets/, blocks/, templates/, parts/,
            theme.json and style.css.

            WORDPRESS CODING STANDARDS, ZERO TOLERANCE

            The repository treats warnings as failures. phpcs.xml.dist enables
            WordPress-Extra (which includes Core), WordPress-Docs,
            Generic.Commenting.Todo and PHPCompatibilityWP with testVersion 7.4-.

            Indentation is one real tab per level in PHP, YAML and JSON, and two
            spaces in CSS and SCSS. Spacing inside control structures and function
            calls. Yoda conditions, and phpcbf does not fix those so they must be
            correct by hand. elseif never else if. Single quotes without
            interpolation, full array() syntax. No trailing whitespace, one newline
            at end of file, aligned array arrows. A docblock with @param, @return
            and @var on every class, method, property, function and constant.

            WordPress Coding Standards 3.4.1 or later is mandatory. At or below
            3.4.0 it is vulnerable to GHSA-3pwp-g2mj-5p3v, a remote code execution
            issue triggered when PHP_CodeSniffer lints untrusted code, and CI lints
            fork pull requests.

            CRITICAL ARCHITECTURE RULES

            1. should_load_separate_core_block_assets and
               should_load_block_assets_on_demand must both be filtered to true in
               inc/setup.php. This is the biggest performance lever a block theme
               has. should_load_remote_block_patterns must be false, because this
               theme makes no outbound HTTP requests.
            2. style.css and templates/index.html must both exist or WordPress
               will not recognise this as a block theme.
            3. block-templates/ and block-template-parts/ must never exist. Core
               checks file_exists() on the stylesheet directory and switches to
               legacy handling if EITHER exists, which silently breaks templates/.
            4. Template parts are .html and cannot contain PHP. Header and footer
               content needing i18n or a dynamic value belongs in patterns/*.php.
            5. Patterns execute on init, so is_single(), get_post(), the_title()
               and the loop are unavailable there. Only esc_html_e(), esc_html(),
               get_theme_file_uri() and iteration over static data work.
            6. Every PHP file opens with defined( 'ABSPATH' ) || exit; after its
               docblock. A namespaced file puts namespace X; first, because PHP
               requires it to be the very first statement.
            7. render.php must be side-effect free. It is included once per block
               instance, so a function or class declared inside it is a fatal
               redeclaration error on the second instance. It must also return a
               string and never echo, so emitted whitespace never becomes visible
               output between block wrappers.
            8. block.json "type": "string" is a type assertion, not sanitization.
               Attribute values remain untrusted at render time and must be
               escaped per output context.
            9. No custom post types, no taxonomies, no shortcodes, no form
               handling, no register_block_type() in PHP. Project data lives in
               block attributes inside post content.
            10. Never emit a raw email address or a mailto link. Contact is a form
                with an intent dropdown.
            11. The development noindex helper is gated behind WP_DEBUG AND an
                explicit opt-in so a stray constant cannot deindex production. Do
                not weaken that gate.
            12. No em dashes and no en dashes anywhere in shipped code or copy.
                CI greps for U+2014 and U+2013. It applies to your own output too.
            13. No skill percentage bars, no progress meters, no star ratings in
                any output.
            14. No outbound HTTP requests of any kind.

            PERFORMANCE BUDGET

            Lighthouse Performance 95 or better mobile and 98 or better desktop.
            LCP under 1.8s. INP under 150ms. CLS 0.05 or lower. TTFB under 400ms at
            p75. TBT 100ms or lower. Front end JS 150KB compressed or less. CSS
            50KB compressed or less. Maximum 2 self-hosted WOFF2 web fonts, each
            with metric-matched fallback @font-face declarations using size-adjust,
            ascent-override, descent-override and line-gap-override. Multiple
            fallbacks are required, because Arial does not exist on Android, so a
            stack relying on it silently re-flows the page on Android and destroys
            CLS. No jQuery anywhere.

            Look specifically for the no_found_rows trap, which adds one
            FOUND_ROWS query per query, and for the N+1 cache priming trap, where
            setting update_post_term_cache to false converts one cache priming
            query into one query per post inside the loop and also disables
            lazy_load_term_meta. Flag any is_user_logged_in() branch in a template,
            because object caching is keyed by URL rather than by user and that
            leaks content or the admin bar. The LCP image needs
            fetchpriority="high".

            BUILD AND TOKENS

            @wordpress/scripts is used for stylelint, eslint and formatting only,
            never to compile SCSS, because stock wp-scripts has no includePaths,
            will not compile a standalone style.scss, and does not expose
            silenceDeprecations. CSS is compiled with the Dart Sass CLI. Write @use
            and @forward only, never @import. Colours, fonts and spacing sizes are
            consumed at runtime as --wp--preset--* custom properties and must never
            be duplicated as SCSS variables or hand-written hex values. Only
            compile-time-only values, so breakpoints, content width and mixin
            parameters, belong in generated SCSS. assets/styles/generated/ is
            generated from theme.json and must never be edited by hand.

            OUTPUT RULES

            Report only issues you can point at with a file path and a line number,
            and cite the exact sniff name where one applies. Rank findings by
            severity, with security and correctness above performance above style.
            Never propose adding a phpcs:ignore or phpcs:disable comment. Never
            propose editing phpcs.xml.dist to weaken a check. Never propose
            weakening or deleting a test. Never propose code that would itself fail
            the gates. Never use an em dash or an en dash in your output.

            Do not file an issue for something that is already enforced by a passing
            CI gate, and do not restate a rule with no violation attached to it. An
            audit issue with no file and no line is noise.