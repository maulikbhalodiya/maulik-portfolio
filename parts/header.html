<!--
	Header template part.

	Constraint that matters here: template parts are parsed as block markup, not
	executed as PHP. They cannot contain PHP, they cannot call esc_html_e(), and
	they cannot read options. Anything in a part that needs translation or a
	dynamic value has to live in a pattern instead, because patterns are PHP and
	are included at init time.

	The equivalent Twenty Twenty-Five header uses a Site Title block, which
	handles its own i18n internally. That is the pattern to follow rather than
	trying to translate a string here.

	No navigation block yet. A navigation block needs a menu to be assigned, and
	an unassigned navigation block renders an empty container that costs layout
	shift. It goes in once there is a menu.
-->
<!-- wp:group {"tagName":"header","className":"site-header","layout":{"type":"constrained"}} -->
<header class="wp-block-group site-header">
	<!-- wp:site-title {"level":0} /-->
</header>
<!-- /wp:group -->
